name: Android UI CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ui.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landscape:
    name: Landscape UI on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install emulator and Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" \
            "emulator" "system-images;android-36;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name atoutia-ui --package "system-images;android-36;google_apis;x86_64" --device pixel_7

      - name: Start isolated emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd atoutia-ui -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -cores 2 -memory 2048 \
            > "$RUNNER_TEMP/atoutia-emulator.log" 2>&1 &
          timeout 180s adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell input keyevent 82

      - name: Build debug and targeted test APKs
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest -PATOUTIA_TEST_AUTOPLAY_PLAYER_0=false

      - name: Run only isolated landscape UI tests
        run: |
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5554 shell am instrument -w \
            -e class tech.devoo.atoutia.ui.game.LandscapeGameScreenInstrumentedTest \
            tech.devoo.atoutia.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/atoutia-ui-result.txt"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          result = (Path(os.environ["RUNNER_TEMP"]) / "atoutia-ui-result.txt").read_text()
          passed = bool(re.search(r"^OK \(4 tests\)\s*$", result, re.MULTILINE))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Isolated landscape instrumentation: " + ("4/4 passed" if passed else "FAILED") + "\n")
          if not passed:
              raise SystemExit("The four landscape UI tests did not all pass.")
          PY

      - name: Report failures and stop emulator
        if: always()
        run: |
          if [[ "${{ job.status }}" != "success" ]]; then
            tail -100 "$RUNNER_TEMP/atoutia-emulator.log" || true
            adb -s emulator-5554 logcat -d -s AndroidRuntime:E TestRunner:E || true
          fi
          adb -s emulator-5554 emu kill || true
