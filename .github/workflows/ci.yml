name: Engine and backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-backend:
    name: Engine and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check committed whitespace
        # On a PR, HEAD is GitHub's merge commit and HEAD^ is the base branch.
        run: git diff --check HEAD^ HEAD

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Setup pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build engine
        run: |
          pnpm --filter @atoutia/belote-engine typecheck
          pnpm --filter @atoutia/belote-engine test
          pnpm --filter @atoutia/belote-engine build

      - name: Validate and build backend
        run: |
          pnpm --filter @atoutia/backend typecheck
          pnpm --filter @atoutia/backend test
          pnpm --filter @atoutia/backend build

      - name: Validate Android launcher path handling
        run: node --test apps/backend/scripts/dev-adb.test.mjs

      - name: Validate synthetic SQLite CLI scenarios
        run: node apps/backend/scripts/dev-expiration-preview.mjs

      - name: Check tracked files remain unchanged
        run: git diff --exit-code
