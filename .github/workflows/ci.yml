name: Engine and backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-backend:
    name: Engine and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check committed whitespace
        # On a PR, HEAD is GitHub's merge commit and HEAD^ is the base branch.
        run: git diff --check HEAD^ HEAD

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Setup pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build engine
        run: |
          pnpm --filter @atoutia/belote-engine typecheck
          pnpm --filter @atoutia/belote-engine test
          pnpm --filter @atoutia/belote-engine build

      - name: Validate offline game and committed Android bundle
        run: |
          pnpm --filter @atoutia/offline-game typecheck
          pnpm --filter @atoutia/offline-game bundle:check
          pnpm --filter @atoutia/offline-game test
          pnpm --filter @atoutia/offline-game build

      - name: Validate and build backend
        run: |
          pnpm --filter @atoutia/backend typecheck
          pnpm --filter @atoutia/backend test
          pnpm --filter @atoutia/backend build

      - name: Validate current and historical match simulations
        timeout-minutes: 6
        run: |
          pnpm --filter @atoutia/belote-engine test:simulation
          node packages/belote-engine/scripts/simulate-matches.mjs \
            --matches 1000 --start-seed 20261028 --max-duration-ms 120000 \
            --report "$RUNNER_TEMP/atoutia-engine-simulation.json"
          node packages/belote-engine/scripts/simulate-matches.mjs \
            --matches 1000 --start-seed 20261028 --max-duration-ms 120000 \
            --rules-version CLASSIC_LEGACY_LITIGE_TAKER \
            --report "$RUNNER_TEMP/atoutia-engine-simulation-legacy.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          for (const [actualPath, referencePath, rules] of [
            ['atoutia-engine-simulation.json', 'engine-simulation-winner-1000.json', 'CLASSIC_LITIGE_WINNER'],
            ['atoutia-engine-simulation-legacy.json', 'engine-simulation-1000.json', 'CLASSIC_LEGACY_LITIGE_TAKER'],
          ]) {
            const actual = read(process.env.RUNNER_TEMP + '/' + actualPath);
            const reference = read('docs/reports/' + referencePath);
            assert.equal(actual.rulesVersion, rules);
            assert.equal(actual.config.rulesVersion, rules);
            if (reference.rulesVersion !== undefined) assert.equal(reference.rulesVersion, rules);
            for (const key of ['formatVersion', 'harnessVersion', 'engineVersion', 'targetScore', 'seedStride', 'status', 'matchesCompleted', 'totals', 'transcriptSha256', 'failure', 'incomplete']) {
              assert.deepEqual(actual[key], reference[key], 'Campaign reference mismatch: ' + rules + '/' + key);
            }
            for (const key of ['matches', 'startSeed', 'maxActionsPerMatch']) {
              assert.equal(actual.config[key], reference.config[key], 'Campaign config mismatch: ' + key);
            }
            console.log('Campaign matches committed reference: ' + rules + ' ' + actual.transcriptSha256);
          }
          NODE

      - name: Validate built player snapshot package
        run: node apps/backend/scripts/dev-check-player-hand.mjs

      - name: Validate synthetic SQLite CLI scenarios
        run: node apps/backend/scripts/dev-expiration-preview.mjs

      - name: Check tracked files remain unchanged
        run: git diff --exit-code
